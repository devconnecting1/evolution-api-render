services:
  - type: keyvalue
    name: evolution-redis
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: evolution-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "true"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "true"
      - key: DATABASE_SAVE_IS_ON_WHATSAPP
        value: "true"
      - key: DATABASE_SAVE_IS_ON_WHATSAPP_DAYS
        value: "7"
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          type: keyvalue
          name: evolution-redis
          property: connectionString
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_SAVE_INSTANCES
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "false"
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "false"
      - key: TELEMETRY_ENABLED
        value: "false"
      - key: DEL_INSTANCE
        value: "false"
      - key: LOG_LEVEL
        value: ERROR,WARN,INFO
      - key: LOG_BAILEYS
        value: error
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Evolution API
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: QRCODE_LIMIT
        value: "30"
      - key: LANGUAGE
        value: pt-BR
      - key: TYPEBOT_ENABLED
        value: "true"
      - key: CHATWOOT_ENABLED
        value: "true"
      - key: OPENAI_ENABLED
        value: "true"
      - key: DIFY_ENABLED
        value: "true"
      - key: N8N_ENABLED
        value: "true"
      - key: EVOAI_ENABLED
        value: "true"
      - key: FLOWISE_ENABLED
        value: "true"
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        value: spring-boat-14626479
      - key: NEON_ORG_ID
        value: org-soft-mouse-21767293
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: RENDER_SERVICE_IDS
        value: "srv-dbd9qqi9lscs73aoe85g,red-dbd9qp29lscs73aoe2s0"
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        value: team_L4ydLNVlb1XnoQd49WIvXRfw
      - key: VERCEL_PROJECT_ID
        value: prj_1qlhQq1PuLn20KRs2FK0fsD0GIvU
      - key: GITHUB_TOKEN
        sync: false
      # recibos da cobrança manual (nome, CPF e cidade do operador pessoa física); só no recibo
      - key: BILLING_PROVIDER_NAME
        sync: false
      - key: BILLING_PROVIDER_DOC
        sync: false
      - key: BILLING_PROVIDER_CITY
        sync: false
      - key: GITHUB_OWNER
        value: devconnecting1
      - key: GITHUB_REPO
        value: evolution-api-render
