name: Check Code Quality

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsup.config.ts"
      - "runWithProvider.js"
      - ".github/workflows/check_code_quality.yml"
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsup.config.ts"
      - "runWithProvider.js"
      - ".github/workflows/check_code_quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Check linting
        run: npm run lint:check

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check build
        run: npm run build
