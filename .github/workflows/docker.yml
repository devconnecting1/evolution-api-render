name: Docker

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "Docker/**"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "prisma7.config.ts"
      - "render.yaml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "Docker/**"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "prisma7.config.ts"
      - "render.yaml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag evolution-api:ci .
