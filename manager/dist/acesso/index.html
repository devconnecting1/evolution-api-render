<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10100e" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <!-- Entrada do cliente ("Acesso do cliente"): só o código de acesso, que o administrador cria no painel. -->
    <meta name="wa-api" content="https://evolution-api-x93o.onrender.com" />
    <title>Área do cliente · WhatsAI</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg?v=3" />
    <link rel="manifest" href="/acesso/acesso.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WhatsAI" />
    <link rel="preload" href="/assets/fonts/geist-latin-wght-normal.woff2?v=1" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/geist.css?v=3" />
    <link rel="stylesheet" href="/assets/acesso.css?v=1" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="bg-grid bg-grid-tl"></span>
      <span class="bg-grid bg-grid-br"></span>
    </div>
    <main class="entry">
      <section class="card" aria-labelledby="t">
        <a class="brand" href="/">WhatsAI</a>
        <h1 id="t">Área do cliente</h1>
        <p class="lead" id="lead">Entre com o código de acesso que você recebeu.</p>
        <form id="f" novalidate>
          <label for="code">Código de acesso</label>
          <input id="code" name="code" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" placeholder="Cole o seu código" required aria-describedby="err" />
          <p class="error" id="err" role="alert"></p>
          <button id="go" class="primary" type="submit">Entrar</button>
        </form>
        <p class="help">Não tem o código? Peça a quem configurou o seu atendimento.</p>
        <a class="dev" href="/manager/login">Sou o desenvolvedor</a>
      </section>
    </main>
    <footer class="foot">
      <a href="/privacidade">Privacidade</a>
      <a href="/termos">Termos</a>
      <a href="/manager/login" id="admin">Entrar como administrador</a>
    </footer>
    <script>
      (function () {
        'use strict';
        var API = document.querySelector('meta[name="wa-api"]').content.replace(/\/+$/, '');
        var NAV_OF = { conversas: 'chat', leads: 'leads', agenda: 'agenda', processos: 'processos', plano: 'usage', conexao: 'conexao' };
        function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
        function home(me) {
          var first = (me.modules || []).map(function (m) { return NAV_OF[m]; }).filter(Boolean)[0] || 'conexao';
          return '/manager/instance/' + me.instance.id + '/' + first;
        }

        // already in: straight to the panel
        var saved = null;
        try { saved = JSON.parse(get('wa-portal') || 'null'); } catch (e) {}
        if (/^wac_/.test(get('token') || '') && saved && saved.instanceId) {
          location.replace(home({ instance: { id: saved.instanceId }, modules: saved.modules }));
          return;
        }
        if (/saiu=1/.test(location.search)) document.getElementById('lead').textContent = 'Seu acesso mudou. Entre de novo com o código atual.';

        var form = document.getElementById('f');
        var input = document.getElementById('code');
        var err = document.getElementById('err');
        var go = document.getElementById('go');

        function call(method, path, key) {
          return fetch(API + path, { method: method, headers: key ? { apikey: key } : {}, cache: 'no-store' }).then(function (r) {
            return r.json().catch(function () { return null; }).then(function (data) {
              if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
              return data;
            });
          });
        }

        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var key = input.value.trim();
          err.textContent = '';
          if (!/^wac_[A-Za-z0-9_-]{20,}$/.test(key)) { err.textContent = 'Confira o código: ele começa com "wac_".'; input.focus(); return; }
          go.disabled = true;
          go.textContent = 'Entrando…';
          Promise.all([call('GET', '/'), call('GET', '/client-access/me', key)]).then(function (res) {
            var server = res[0] || {};
            var me = res[1];
            if (!me || !me.client) throw Object.assign(new Error('not client'), { status: 401 });
            set('apiUrl', API);
            set('token', key);
            set('version', server.version || '2');
            if (server.clientName) set('clientName', server.clientName);
            set('instanceId', me.instance.id);
            set('wa-portal', JSON.stringify({ instanceId: me.instance.id, instanceName: me.instance.name, modules: me.modules }));
            location.replace(home(me));
          }).catch(function (e) {
            err.textContent = e.status === 401 || e.status === 403 ? 'Código inválido ou desativado. Peça um novo a quem configurou o seu atendimento.' : 'Não foi possível falar com o servidor agora. Tente de novo em alguns segundos.';
            go.disabled = false;
            go.textContent = 'Entrar';
          });
        });

        document.getElementById('admin').addEventListener('click', function () { del('wa-portal'); });
      })();
    </script>
  </body>
</html>
